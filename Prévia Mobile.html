<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #0a0101; min-height: 100vh; font-family: system-ui, sans-serif; }
  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 40px 16px 60px; box-sizing: border-box; }
  .cap { color: #ff5a45; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; }
  .phone { width: 390px; max-width: 100%; height: 800px; border-radius: 44px; background: #111; padding: 12px; box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 0 0 2px #2a2a2a; position: relative; }
  .phone::before { content: ""; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 120px; height: 26px; background: #000; border-radius: 999px; z-index: 2; }
  .screen { width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: #000; }
  iframe { width: 390px; height: 776px; border: 0; display: block; }
</style>
</head>
<body>
  <div class="stage">
    <span class="cap">Prévia mobile · 390px</span>
    <div class="phone">
      <div class="screen">
        <iframe src="./Orbi Hero.dc.html" title="Orbi mobile"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
