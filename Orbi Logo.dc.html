<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>html,body{margin:0}</style>
</helmet>
<div style="width:1200px;height:1200px;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 22% 18%, #ff2408 0%, #e60d00 26%, #b60300 50%, #6d0100 74%, #240000 100%);font-family:'Orbitron',sans-serif;">
  <div style="display:inline-flex;align-items:center;gap:96px;color:#fff;">
    <span style="position:relative;width:240px;height:240px;flex:none;display:inline-flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 44px rgba(255,255,255,0.55));">
      <span style="position:absolute;inset:30px;border:12px solid #fff;border-radius:50%;"></span>
      <span style="position:absolute;width:42px;height:42px;border-radius:50%;background:#fff;"></span>
      <span style="position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 0 52px #fff;"></span>
    </span>
    <span style="display:inline-flex;flex-direction:column;line-height:1;">
      <span style="font-weight:800;font-size:156px;letter-spacing:0.02em;">Orbi</span>
      <span style="font-weight:600;font-size:54px;letter-spacing:0.54em;opacity:0.88;margin-top:26px;">AGÊNCIA</span>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:1200}}"></script>
</body>
</html>
