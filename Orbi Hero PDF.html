<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="omelette-owns-print" content="true">
<style>
  html, body { margin: 0; padding: 0; background: #240000; }
  @page { size: 13.83in 10.11in; margin: 0; }

  .sheet img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media screen { body { display: flex; justify-content: center; padding: 24px; } .sheet { box-shadow: 0 10px 40px rgba(0,0,0,.4); } }
</style>
</head>
<body>
  <div class="sheet"><img src="assets/orbi-hero.png" alt="Orbi Agência hero"></div>
